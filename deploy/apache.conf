<VirtualHost *:80>
    ServerName backup.example.net
    Redirect permanent / https://backup.example.net/
</VirtualHost>

<VirtualHost *:443>
    ServerName backup.example.net
    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/backup.example.net-fullchain.pem
    SSLCertificateKeyFile /etc/ssl/private/backup.example.net.key

    ProxyRequests Off
    ProxyPass / http://127.0.0.1:8080/
    ProxyPassReverse / http://127.0.0.1:8080/
</VirtualHost>
